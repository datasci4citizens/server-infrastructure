apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
# Headless service required by the StatefulSet for stable pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-headless
spec:
  clusterIP: None
  selector:
    app: seaweedfs
  ports:
    - name: master
      port: 9333
    - name: volume
      port: 8080
    - name: filer
      port: 8888
    - name: s3
      port: 8333
