# nginx basic-auth credentials for the Filer UI Ingress (seaweedfs-filer-ingress).
# Not applied via kustomize/ArgoCD — generated and applied by hand, like
# secret.yaml (see secret-example.yaml in this same directory).
#
# 1. Generate an htpasswd file (bcrypt, one or more users):
#      htpasswd -c -B auth <username>
#      htpasswd -B auth <another-username>   # to add more users
#
# 2. Create the secret directly from that file (do not commit `auth`):
#      kubectl create secret generic seaweedfs-filer-auth \
#        --from-file=auth -n seaweedfs
#
# 3. Rotate: overwrite `auth` and re-run step 2 with --dry-run=client -o yaml | kubectl apply -f -
