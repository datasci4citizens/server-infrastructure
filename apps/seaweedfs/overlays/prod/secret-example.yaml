# Copy to secret.yaml and fill values. secret.yaml is gitignored.
#
# IMPORTANT: `weed s3` started WITHOUT -s3.config defaults to Open Access —
# any access key is accepted and the gateway is readable AND writable by
# anyone who can reach it. This Secret is what makes the -s3.config flag in
# base/statefulset.yaml meaningful. Do not expose the Ingress without it.
#
# Because no "anonymous" identity is defined below, unauthenticated requests
# are denied. That is what makes presigned URLs the only read path.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-secret
type: Opaque
stringData:
  s3config.json: |
    {
      "identities": [
        {
          "name": "wounds-app",
          "credentials": [
            {
              "accessKey": "REPLACE_WITH_RANDOM_ACCESS_KEY",
              "secretKey": "REPLACE_WITH_RANDOM_SECRET_KEY"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
# Why "Admin": server-wounds creates its own bucket at pod boot
# (docker/entrypoint.py:23 init_s3_bucket -> create_bucket), and create_bucket
# is not covered by bucket-scoped Read/Write. Admin keeps it to one moving part.
#
# Tighten this when a second tenant (MIH, off MinIO) shares this instance:
# pre-create the buckets, then scope each identity, e.g.
#   "actions": ["Read:wounds", "Write:wounds", "List:wounds", "Tagging:wounds"]
#
# Generate keys with:
#   openssl rand -hex 16    # accessKey
#   openssl rand -hex 32    # secretKey
# The same pair goes into the wounds-secret as AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY in the wounds-server namespace.
