apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wounds-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Phone-camera wound photos exceed the 1MB nginx default on the
    # browser -> Django upload leg.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - server-wounds.ak8s.ic.unicamp.br
      secretName: wounds-tls
  rules:
    - host: server-wounds.ak8s.ic.unicamp.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wounds-api-service
                port:
                  number: 80
