# Copy to secret.yaml and fill values. secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: wounds-secret
type: Opaque
stringData:
  SERVER_WOUNDS_SECRET_KEY: "your-django-secret-key"
  SERVER_WOUNDS_DB_PASSWORD: "postgres"
  GOOGLE_CLIENT_ID: "your-google-oauth-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-oauth-client-secret"
  DJANGO_SUPERUSER_USERNAME: "admin"
  DJANGO_SUPERUSER_EMAIL: "admin@example.com"
  DJANGO_SUPERUSER_PASSWORD: "change-me"
  # Must match the wounds-app identity in the seaweedfs namespace
  # (apps/seaweedfs/overlays/prod/secret-example.yaml -> s3config.json).
  AWS_ACCESS_KEY_ID: "same-as-seaweedfs-wounds-app-accessKey"
  AWS_SECRET_ACCESS_KEY: "same-as-seaweedfs-wounds-app-secretKey"
